name: daily-collect

on:
  schedule:
    # 07:00 and 17:30 Beijing time (UTC+8)
    - cron: '0 23 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      cities:
        description: 'Comma-separated city en names (empty = all 53)'
        default: ''
  # Bootstrap trigger: editing this workflow itself runs the pipeline once,
  # so no manual workflow_dispatch is needed after initial setup. Daily runs
  # come from the schedule above; ordinary code pushes do NOT collect (the
  # path filter matches only this file).
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-collect.yml'

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe data sources
        run: |
          mkdir -p data
          P=$(curl -sS -m 10 -H 'Referer: https://www.weather.com.cn/' 'https://graph.weatherdt.com/ty/pollen/v2/hfindex.html?eletype=1&city=xian&start=2026-09-01&end=2026-09-04&predictFlag=true' || true)
          M=$(curl -sS -m 10 'https://api.open-meteo.com/v1/forecast?latitude=34.266&longitude=108.940&daily=weather_code&timezone=Asia%2FShanghai&forecast_days=3' || true)
          {
            echo "== probe at $(date -u) =="
            echo "--- pollen source (xian) ---"; echo "${P}" | head -c 600; echo
            if echo "${P}" | grep -q 'levelCode'; then echo "POLLEN_STATUS=ok"; else echo "POLLEN_STATUS=fail"; fi
            echo "--- open-meteo (xian) ---"; echo "${M}" | head -c 400; echo
            if echo "${M}" | grep -q 'daily'; then echo "METEO_STATUS=ok"; else echo "METEO_STATUS=fail"; fi
          } > data/probe.txt 2>&1 || true
          cat data/probe.txt

      - name: Fast-fail if pollen source unreachable
        run: |
          if grep -q 'POLLEN_STATUS=ok' data/probe.txt; then
            echo 'pollen source reachable, continue'
          else
            echo '::error::pollen source unreachable from the GitHub runner; skip full collection'
            exit 2
          fi

      - name: Run daily pipeline
        env:
          CITIES: ${{ github.event.inputs.cities }}
          REPORT_CITIES: xian,xianyang
          SLEEP: '0.35'
        run: |
          mkdir -p data
          set -o pipefail
          bash scripts/run_daily.sh 2>&1 | tee data/run-log.txt

      - name: Validate outputs
        run: |
          test -s web/data.json
          test -s web/reports/latest.html
          python3 -c "import json;d=json.load(open('web/data.json'));assert len(d['cities'])>0;print('dashboard cities:',len(d['cities']))"

      - name: Commit snapshots and site
        if: always()
        run: |
          git config user.name  "pollen-sentinel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web reports
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%dT%H:%MZ) [${{ job.status }}]"
            git push
          fi
