name: daily-collect

# GitHub Pages source is set to "GitHub Actions"; the deploy job publishes ./web.
# Republished to pick up the report template polish.

on:
  schedule:
    # 07:00 and 17:30 Beijing time (UTC+8)
    - cron: '0 23 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
  # Bootstrap trigger: editing this workflow itself runs the pipeline once.
  # Daily runs come from the schedule; ordinary code pushes do NOT collect
  # (the path filter matches only this file).
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-collect.yml'

permissions:
  contents: write

concurrency:
  group: daily-collect-shard
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 53 monitored cities split into 8 parallel shards (~7 cities each),
        # so a slow cross-border request cannot blow the whole run's budget.
        # Integer index only; the i/8 shard spec is assembled in the command
        # (artifact names cannot contain '/').
        i: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe pollen source (shard 0)
        if: matrix.i == 0
        run: |
          P=$(curl -sS -m 10 -H 'Referer: https://www.weather.com.cn/' 'https://graph.weatherdt.com/ty/pollen/v2/hfindex.html?eletype=1&city=xian&start=2026-09-01&end=2026-09-04&predictFlag=true' || true)
          echo "${P}" | head -c 400
          echo "${P}" | grep -q 'levelCode' || { echo '::error::pollen source unreachable'; exit 2; }

      - name: Collect shard ${{ matrix.i }}/8 (raw snapshots only)
        run: python3 -m collectors.collect --shard ${{ matrix.i }}/8 --raw-only --sleep 0.35 --days 40

      - name: Upload shard snapshots
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.i }}
          path: data/raw
          retention-days: 7
          if-no-files-found: error

  assemble:
    needs: shard
    if: success() || failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all shard snapshots
        # Tolerate a fully failed matrix so the diagnostic commit still runs.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: data/raw
          merge-multiple: true

      - name: Assemble, report and export (logged)
        id: build
        run: |
          set -o pipefail
          mkdir -p data
          LOG=data/assemble-log.txt
          : > "$LOG"
          {
            echo "=== date (runner TZ): $(date) ==="
            echo "=== tree under data/raw ==="
            find data/raw -type f 2>/dev/null | sort
            echo "snapshot count: $(find data/raw -type f -name '*.json' 2>/dev/null | wc -l)"
            echo "=== assemble ==="
            python3 -m collectors.collect --assemble
            echo "=== build report ==="
            test -f "data/raw/$(date +%F)/xian.json" || {
              # xian may sit one nesting level deeper after artifact merge
              test -n "$(find data/raw -name xian.json -print -quit)" || { echo '::error::xian snapshot missing'; exit 3; }
            }
            python3 -m reporter.build_report --cities xian,xianyang --out web/reports/latest.html
            cp web/reports/latest.html "web/reports/$(date +%F).html"
            mkdir -p web/data
            cp data/personal/diary.json web/data/diary.json
            echo "=== export web ==="
            python3 scripts/export_web.py
            echo "=== validate ==="
            test -s web/data.json
            test -s web/reports/latest.html
            python3 -c "import json;d=json.load(open('web/data.json'));assert len(d['cities'])>0;print('dashboard cities:',len(d['cities']))"
            echo "=== BUILD OK ==="
          } 2>&1 | tee "$LOG"

      - name: Commit snapshots and site (also saves diagnostics on failure)
        if: always()
        run: |
          git config user.name  "pollen-sentinel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data web reports; do
            [ -e "$d" ] && git add "$d"
          done
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%dT%H:%MZ) [${{ job.status }}]"
            git push || echo "::warning::git push failed (non-fast-forward?)"
          fi

  deploy:
    # Runs inside the same workflow, so it is NOT subject to the rule that
    # GITHUB_TOKEN pushes don't trigger new workflow runs. It checks out the
    # freshly committed site and publishes it to GitHub Pages.
    needs: assemble
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - id: deployment
        uses: actions/deploy-pages@v4
