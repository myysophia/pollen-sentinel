name: daily-collect

on:
  schedule:
    # 07:00 and 17:30 Beijing time (UTC+8)
    - cron: '0 23 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:
  # Bootstrap trigger: editing this workflow itself runs the pipeline once.
  # Daily runs come from the schedule; ordinary code pushes do NOT collect
  # (the path filter matches only this file).
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-collect.yml'

permissions:
  contents: write

concurrency:
  group: daily-collect-shard
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 53 monitored cities split into 8 parallel shards (~7 cities each),
        # so a slow cross-border request cannot blow the whole run's budget.
        shard: ['0/8', '1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe pollen source (shard 0)
        if: matrix.shard == '0/8'
        run: |
          P=$(curl -sS -m 10 -H 'Referer: https://www.weather.com.cn/' 'https://graph.weatherdt.com/ty/pollen/v2/hfindex.html?eletype=1&city=xian&start=2026-09-01&end=2026-09-04&predictFlag=true' || true)
          echo "${P}" | head -c 400
          echo "${P}" | grep -q 'levelCode' || { echo '::error::pollen source unreachable'; exit 2; }

      - name: Collect shard ${{ matrix.shard }} (raw snapshots only)
        run: python3 -m collectors.collect --shard ${{ matrix.shard }} --raw-only --sleep 0.35 --days 40

      - name: Upload shard snapshots
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.shard }}
          path: data/raw
          retention-days: 7
          if-no-files-found: error

  assemble:
    needs: shard
    if: success() || failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all shard snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: data/raw
          merge-multiple: true

      - name: Inspect downloaded snapshots
        run: |
          find data/raw -type f -name '*.json' | sort
          echo "snapshot count: $(find data/raw -type f -name '*.json' | wc -l)"

      - name: Assemble normalised CSVs from snapshots
        run: python3 -m collectors.collect --assemble

      - name: Build personal report (xian/xianyang)
        run: |
          test -f "data/raw/$(date +%F)/xian.json" || { echo '::error::xian snapshot missing'; exit 3; }
          python3 -m reporter.build_report --cities xian,xianyang --out web/reports/latest.html
          cp web/reports/latest.html "web/reports/$(date +%F).html"
          mkdir -p web/data
          cp data/personal/diary.json web/data/diary.json

      - name: Export national dashboard data
        run: python3 scripts/export_web.py

      - name: Validate outputs
        run: |
          test -s web/data.json
          test -s web/reports/latest.html
          python3 -c "import json;d=json.load(open('web/data.json'));assert len(d['cities'])>0;print('dashboard cities:',len(d['cities']))"

      - name: Commit snapshots and site
        if: always()
        run: |
          git config user.name  "pollen-sentinel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web reports
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: daily snapshot $(date -u +%Y-%m-%dT%H:%MZ) [${{ job.status }}]"
            git push
          fi
