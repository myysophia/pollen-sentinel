name: backfill-history

# Manually backfill pollen levels since 2022-08 into data/daily/pollen.csv.
# Go to Actions -> backfill-history -> Run workflow. Takes a few minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backfill full pollen history (all cities)
        run: python3 -m collectors.collect --backfill --sleep 0.8

      - name: Commit history CSV
        run: |
          git config user.name  "pollen-sentinel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: backfill pollen history since 2022"
            git push
          fi
